<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLS Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 30px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

video {
    display: block;
    width: 100%;
    max-width: 850px;
    margin: auto;
    aspect-ratio: 16 / 9;
    background: #000;
    object-fit: contain;
}

#status {
    text-align: center;
    color: #aaa;
}
</style>
</head>

<body>

<video id="video" controls playsinline preload="auto"
       poster="https://example.com/your-poster.jpg"></video>

<p id="status">Loading stream...</p>

<script>
const STREAM = "https://aaaamoonlight1-a11y.github.io/few/yidvg3.m3u8";

const video = document.getElementById("video");
const statusEl = document.getElementById("status");

let hls;

video.addEventListener("waiting", () => statusEl.textContent = "Buffering...");
video.addEventListener("playing", () => statusEl.textContent = "Playing");
video.addEventListener("pause",   () => statusEl.textContent = "Paused");

if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = STREAM;
    statusEl.textContent = "Stream ready";
} else if (Hls.isSupported()) {
    hls = new Hls({
        enableWorker: true,
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        backBufferLength: 30
    });

    hls.attachMedia(video);

    hls.on(Hls.Events.MEDIA_ATTACHED, () => {
        hls.loadSource(STREAM);
    });

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
        statusEl.textContent = "Ready to play";
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
        if (!data.fatal) return;

        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            statusEl.textContent = "Network error. Retrying...";
            hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
        } else {
            statusEl.textContent = "Stream error: " + data.details;
        }
    });
} else {
    statusEl.textContent = "HLS not supported";
}

window.addEventListener("pagehide", () => {
    hls?.destroy();
});
</script>

</body>
</html>
